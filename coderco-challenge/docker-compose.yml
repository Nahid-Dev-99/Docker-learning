version: '3.8'

services:
  web:
    build: .
    expose:
      - "5005"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis

  redis:
    image: "redis:alpine"
    volumes:
      - redis-data:/data

  nginx: # <-- Indented 2 spaces so it belongs to 'services'
    image: nginx:latest
    ports:
      - "5005:5005"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web

# Bonus: Define the volume for persistent Redis storage
volumes:
  redis-data: